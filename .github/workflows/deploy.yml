on: 
  push:
    paths-ignore:
    - 'README.md'
    - 'LICENSE'
    - 'vercel.json'
    - '.gitattributes'
    - '.gitignore'
    - '.github/**'
    branches:
    - main
  workflow_dispatch:
jobs:
  build:
    name: Build the app (add deps)
    if: github.repository == 'Pigamer37/animeflv-stremio-addon' #forks don't have the deploy secrets
    environment: alwaysdata
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6.1.0
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ vars.NODE_VERSION }}
        cache: 'npm'
    - name: npm install (npm ci)
      run: npm ci
    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v7.0.1
      with:
        name: node-app
        path: .
  deploy:
    environment: alwaysdata
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v8.0.1
      with:
        name: node-app
    - name: SFTP upload
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      #uses: Dylan700/sftp-upload-action@v1.2.4
      with:
        username: ${{ vars.USERNAME }}
        server: ${{ vars.SSHSERVER }}
        port: ${{ vars.PORT }}
        remote_path: ${{ vars.DEST_FOLDER }}
        sftp_only: true
        password: ${{secrets.sshpassword}}
        #uploads: ${{ vars.FOLDERS }}
        #ignore: |
          # *.git
          # */**/*git*
          # README.md
          # LICENSE
          # vercel.json
          # .gitattributes
          # .gitignore
          # .github
    - name: Restart app
      #plain curl instead of Satak/webrequest-action, which targets the deprecated Node 20; same request and credentials,
      #and --fail-with-body makes the job fail (showing alwaysdata's answer) if the restart is refused
      env:
        APIKEY: ${{ secrets.APIKEY }}
        API_KEY: ${{ secrets.API_KEY }}
        ACCOUNT: ${{ vars.USERNAME }}
      run: |
        curl --fail-with-body -sS -X POST \
          -H "Authentication: $APIKEY" \
          -u "$API_KEY:account=$ACCOUNT:" \
          https://api.alwaysdata.com/v1/site/970871/restart/
