on: 
  push:
    paths-ignore:
    - 'README.md'
    - 'LICENSE'
    - 'vercel.json'
    - '.gitattributes'
    - '.gitignore'
    - '.github/**'
    branches:
    - main
  workflow_dispatch:
jobs:
  test:
    name: Offline tests
    if: github.repository == 'Pigamer37/animeflv-stremio-addon' #forks don't have the deploy secrets
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ vars.NODE_VERSION }}
        cache: 'npm'
    - run: npm ci
    - run: npm test
  build:
    name: Build the app (add deps)
    environment: alwaysdata
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6.1.0
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ vars.NODE_VERSION }}
        cache: 'npm'
    - name: npm install (npm ci)
      run: npm ci
    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v7.0.1
      with:
        name: node-app
        path: .
  deploy:
    environment: alwaysdata
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v8.0.1
      with:
        name: node-app
    - name: SFTP upload
      uses: wlixcc/SFTP-Deploy-Action@v1.2.6
      #uses: Dylan700/sftp-upload-action@v1.2.4
      with:
        username: ${{ vars.USERNAME }}
        server: ${{ vars.SSHSERVER }}
        port: ${{ vars.PORT }}
        remote_path: ${{ vars.DEST_FOLDER }}
        sftp_only: true
        password: ${{secrets.sshpassword}}
        #uploads: ${{ vars.FOLDERS }}
        #ignore: |
          # *.git
          # */**/*git*
          # README.md
          # LICENSE
          # vercel.json
          # .gitattributes
          # .gitignore
          # .github
    - name: Restart app
      uses: Satak/webrequest-action@v1.5.0
      with:
        url: https://api.alwaysdata.com/v1/site/970871/restart/
        method: POST
        headers: '{"Authentication": "${{ secrets.APIKEY }}"}'
        username: ${{ secrets.API_KEY }}
        password: 'account=${{ vars.USERNAME }}:'
